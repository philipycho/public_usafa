<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulated Cadets Dataset</title>
<style>
  :root {
    --usafa-blue: #174889;
    --usafa-blue-dark: #0f3363;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --text-muted: #57606a;
    --row-alt: #f8fafc;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: linear-gradient(135deg, var(--usafa-blue) 0%, var(--usafa-blue-dark) 100%);
    color: #ffffff;
    padding: 1.75rem 1.5rem;
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  header a.back {
    display: block;
    font-size: 0.8rem;
    color: #cfe0f5;
    text-decoration: none;
    margin-bottom: 0.5rem;
  }
  header a.back:hover { text-decoration: underline; }

  header h1 {
    margin: 0;
    font-size: 1.3rem;
  }

  header p {
    margin: 0.3rem 0 0;
    font-size: 0.88rem;
    color: #dbe7f6;
  }

  .download-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: #ffffff;
    color: var(--usafa-blue-dark);
    font-weight: 700;
    font-size: 0.88rem;
    text-decoration: none;
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
  }
  .download-btn:hover { background: #eaf1fb; }
  .download-btn svg { width: 16px; height: 16px; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  .meta {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
  }

  .table-wrap {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: auto;
    max-height: 75vh;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--usafa-blue-dark);
    color: #ffffff;
    text-align: left;
    padding: 0.6rem 0.9rem;
    font-weight: 600;
    z-index: 1;
  }

  tbody td {
    padding: 0.45rem 0.9rem;
    border-bottom: 1px solid var(--border);
  }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: #eef3fa; }

  .status {
    padding: 2rem;
    text-align: center;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <a class="back" href="../index.html">&larr; Back to Course Materials</a>
      <h1>Simulated Cadets Dataset</h1>
      <p>DS220 — Data-Driven Statistics with AI · Fall 2026</p>
    </div>
    <a class="download-btn" href="simulated_cadets.csv" download="simulated_cadets.csv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
      Download CSV
    </a>
  </div>
</header>

<main>
  <p class="meta" id="meta">Loading dataset…</p>
  <div class="table-wrap">
    <table id="data-table">
      <thead><tr id="header-row"></tr></thead>
      <tbody id="body-rows"></tbody>
    </table>
  </div>
</main>

<script>
  fetch('simulated_cadets.csv')
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(text => {
      const lines = text.trim().split(/\r?\n/);
      const headers = lines[0].split(',');
      const headerRow = document.getElementById('header-row');
      headers.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        headerRow.appendChild(th);
      });

      const body = document.getElementById('body-rows');
      const frag = document.createDocumentFragment();
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i]) continue;
        const cells = lines[i].split(',');
        const tr = document.createElement('tr');
        cells.forEach(c => {
          const td = document.createElement('td');
          td.textContent = c;
          tr.appendChild(td);
        });
        frag.appendChild(tr);
      }
      body.appendChild(frag);

      document.getElementById('meta').textContent =
        (lines.length - 1).toLocaleString() + ' rows × ' + headers.length + ' columns. ' +
        'Use the Download CSV button to save the file for analysis in Python, R, or Excel.';
    })
    .catch(err => {
      document.querySelector('.table-wrap').innerHTML =
        '<p class="status">Could not load preview (' + err.message + '). Use the Download CSV button above instead.</p>';
      document.getElementById('meta').textContent = '';
    });
</script>

</body>
</html>
